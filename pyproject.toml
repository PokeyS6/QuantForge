[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quantforge"
version = "0.1.0"
description = "A Python foundation for QuantForge."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer",
]

[project.scripts]
quantforge = "quantforge.cli:app"

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
